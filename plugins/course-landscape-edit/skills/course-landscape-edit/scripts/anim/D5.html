<!doctype html><meta charset=utf-8><link rel=stylesheet href="../node_modules/misans/lib/Normal/MiSans-Heavy.min.css"><link rel=stylesheet href="../node_modules/misans/lib/Normal/MiSans-Bold.min.css"><link rel=stylesheet href="../node_modules/misans/lib/Normal/MiSans-Semibold.min.css"><link rel=stylesheet href="../node_modules/misans/lib/Normal/MiSans-Medium.min.css"><script src=lib.js></script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{width:1920px;height:1080px;overflow:hidden;background:#F4F2EE;font-family:MiSans;color:#111;position:relative}
.panel{position:absolute;left:64px;top:126px;width:1240px;height:698px;background:#fff;border-radius:28px;box-shadow:0 20px 50px rgba(30,30,40,.08);overflow:hidden}
.boxsh{position:absolute;left:1336px;top:284px;width:520px;height:540px;border-radius:28px;box-shadow:0 20px 50px rgba(30,30,40,.12)}
.a{position:absolute}.lab{font:500 30px MiSans;color:#8A8F98}.h{font:900 68px MiSans;letter-spacing:-1px}
.pill{position:relative;display:inline-block;margin:0 10px}.pill i{position:absolute;inset:-4px -10px;background:#2F6BFF;border-radius:14px}.pill b{position:relative;font-weight:900}
.chip{display:inline-block;padding:12px 26px;border-radius:999px;background:#EEF0F3;font:600 32px MiSans;color:#333}
.card{position:absolute;background:#F6F7F9;border-radius:22px;padding:30px 34px}
</style><body><div class=panel id=P></div><div class=boxsh></div><div class=a style="left:64px;top:126px;width:1240px;height:698px"><div id=x0 class=card style="left:70px;top:80px;width:520px;height:400px"><div class=lab>在输入框里写</div><div style="font:700 42px MiSans;margin-top:20px;color:#555;line-height:1.5">“左边那个改一下<br>上面也改改……”</div><div class=a style="left:150px;top:270px;width:200px;height:100px;border-radius:50%;background:radial-gradient(rgba(150,150,160,.35),transparent 70%)"></div></div><div id=x1 class=card style="left:640px;top:80px;width:530px;height:400px;background:#EEF4FF"><div class=lab style="color:#2F6BFF">画布 + 小圆点</div><div style="font:700 42px MiSans;margin-top:20px;line-height:1.5;opacity:0">.</div><div id=dot class=a style="left:250px;top:250px;width:44px;height:44px;border-radius:50%;background:#2F6BFF;box-shadow:0 0 0 12px rgba(47,107,255,.2),0 0 0 26px rgba(47,107,255,.1)"></div></div><div id=x2 class=a style="left:640px;top:190px;font:900 62px MiSans"><span class=pill><i id=pxi></i><b id=pxb>精准很多</b></span></div><div id=tip class=a style="left:70px;top:530px;width:1100px;height:110px;border-radius:22px;background:#111;color:#fff;display:flex;align-items:center;gap:24px;padding:0 36px"><span style="background:#FFD60A;color:#111;font:900 28px MiSans;padding:6px 16px;border-radius:10px">小技巧</span><span style="font:700 40px MiSans">还能省额度、省成本</span></div></div><script>const C=[0.0, 1.034, 3.634, 5.067, 6.3, 8.967];function render(t){rise($('x0'),t,C[1],0.45,24);rise($('x1'),t,C[3]-0.4,0.45,24);const p=prog(t,C[3],0.6);$('dot').style.transform=`scale(${t>C[3]?1+0.25*Math.sin(p*Math.PI):0.001})`;rise($('x2'),t,C[3]+0.2,0.4,16);$('x2').style.top='170px';$('x2').style.left='680px';wipe($('pxi'),t,C[3]+0.4,0.35);$('pxb').style.color=t>C[3]+0.4+0.1?'#fff':'#111';rise($('tip'),t,C[4],0.5,30);}</script></body>
